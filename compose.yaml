services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      CACHE_DIR: /data/.youtube-cache
      CACHE_TTL: ${CACHE_TTL:-21600}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-268435456}
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      WIRE_API_KEY: ${WIRE_API_KEY:-}
      WIRE_WEBHOOK_SECRET: ${WIRE_WEBHOOK_SECRET:-}
    volumes:
      - jobs:/data
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
volumes:
  jobs:
  certificates:
  caddy_config:
